<!--
  O ícone do site. Faltava: o Starlight aponta para `/favicon.svg` por padrão, e nada em
  `site/public/` servia esse caminho — 122 páginas pedindo um arquivo que respondia 404.

  O vermelho é o `#FF2D20` do Laravel, que é o que a arte do repositório (banner, logo) já usa e
  de onde o `kit.css` deriva o acento. Monograma em traço, e não texto: `<text>` em favicon
  depende da fonte que o navegador resolver, e o traço tem a mesma forma em todos.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Starter Kit Easy">
  <rect width="32" height="32" rx="7" fill="#FF2D20"/>
  <g fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M11 8v16"/>
    <path d="M22 8 11.6 16.4"/>
    <path d="M11.6 15.6 22 24"/>
  </g>
</svg>
