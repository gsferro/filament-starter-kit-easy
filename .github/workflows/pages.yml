# Publica o site de documentação (Astro Starlight) no GitHub Pages.
#
# Substitui o build nativo do Pages, que rodava Jekyll em `--safe` a partir de `main:/docs`. O
# motivo está na ADR-01 de `wikis/specs/feat/site-starlight/site-starlight/` — e a saída já estava
# nomeada na ADR-01 da wiki anterior, que escolheu o Jekyll sabendo que o `--safe` proíbe qualquer
# plugin de i18n.
#
# `Settings → Pages → Source` precisa estar em **GitHub Actions** para este fluxo valer. Enquanto
# estiver em "Deploy from a branch", o Pages ignora o que sai daqui.
name: pages

on:
  push:
    branches: [main]
    # O conteúdo vive em `docs/` (ADR-02) e o toolchain em `site/`. Os dois disparam.
    paths:
      - 'docs/**'
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Um deploy por vez, e sem cancelar o que está no ar: cancelar no meio deixa o Pages num estado
# que ele mesmo precisa reconciliar depois.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    # No NÍVEL DO JOB, e não no passo do build: o conferidor de links precisa descontar o mesmo
    # prefixo que o build aplicou, e o de acessibilidade precisa navegar para ele. Com a variável
    # só no `run` do build, os dois enxergavam raiz enquanto o HTML tinha o prefixo — foi o que
    # derrubou o primeiro deploy, com centenas de falsos positivos.
    env:
      DOCS_BASE: /filament-starter-kit-easy

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Instalar dependências
        working-directory: site
        run: npm ci

      - name: Construir o site
        working-directory: site
        # O `base` sai do `env` do job — ver o comentário lá. Ele é o nome do repositório: o site
        # é de projeto, não de usuário, e mora em `gsferro.github.io/filament-starter-kit-easy/`.
        # Sem ele, todo link interno aponta para a raiz do domínio e dá 404 — o mesmo defeito que o
        # `baseurl` do Jekyll evitava.
        run: npm run build

      - name: Conferir links, âncoras e redirects
        working-directory: site
        # ANTES do envio, de propósito: link quebrado não deve chegar ao ar só porque o build
        # compilou. O script reprova com código de saída — e tem piso de população, senão ficaria
        # verde sobre um `dist/` vazio.
        run: node verifica-links.mjs

      - name: Instalar o navegador do Playwright
        working-directory: site
        run: npx playwright install --with-deps chromium

      - name: Conferir acessibilidade (axe, WCAG 2.1 AA, nos dois temas)
        working-directory: site
        # Sobe a prévia, roda o axe contra o site CONSTRUÍDO e derruba o job em qualquer violação
        # `serious`/`critical`. Nos dois temas de propósito: este site já teve um defeito de cor
        # que era impecável no escuro e ilegível no claro.
        run: |
          npx astro preview &
          npx wait-on "http://localhost:4321${DOCS_BASE}/pt/" -t 60000
          node verifica-acessibilidade.mjs

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
