name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  qualidade:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: bcmath, intl, pcntl, zip, sqlite3, pdo_sqlite
          coverage: none

      - name: Cache das dependências PHP
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php84-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-php84-

      - name: Instalar dependências
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Preparar ambiente
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Estilo (Pint)
        run: vendor/bin/pint --test

      - name: Análise estática (PHPStan)
        run: vendor/bin/phpstan analyse --no-progress

      # Seleção de suíte, e NÃO `--exclude-group=browser`: o grupo é filtrado na EXECUÇÃO,
      # mas o pest-plugin-browser sobe o Playwright já na COLETA — ao parsear qualquer
      # arquivo com `visit()` (UsesBrowserTestCaseMethodFilter.php:57-60). Com o grupo, este
      # job morria em PlaywrightNotInstalledException sem rodar um único teste. Nomear as
      # suítes tira as pastas de browser da coleta, e elas seguem cobertas no job `telas`.
      # `--parallel` porque a suíte em série não usa o runner: medido em 2026-09-24, a MESMA
      # suíte e o MESMO commit levam 1.162 s em série aqui e 334 s em paralelo (16 núcleos).
      # O runner tem 4 vCPU, e três ficavam parados durante 19 minutos.
      #
      # A regra `.ai/rules/testes-browser.md` PROIBE `--parallel` com navegador, e a proibição
      # **não alcança este job**: ele nomeia as suítes, e `Browser`/`BrowserTenancy` não estão
      # entre elas — elas rodam no job `telas`, em série. Isto está escrito porque confundir os
      # dois casos já produziu o achado QA-11 e a reincidência QA-24.
      - name: Testes (Pest)
        run: php artisan test --testsuite=Unit,Feature,Kit,Tenancy --parallel

  telas:
    # Navegador real sobre as 52 telas dos três painéis. Job próprio porque é o único que
    # precisa de Node + browsers do Playwright, e porque uma falha aqui não deve esconder uma
    # falha de estilo.
    #
    # A redação anterior justificava a separação dizendo que este job "leva ~2min contra os
    # segundos do job de qualidade". **O número inverteu de sinal e ninguém remediu**: medido
    # em 2026-09-24, `telas` leva 226 s e `qualidade` levava 1.162 s. A separação continua
    # certa, por outro motivo — isolar Node e Playwright — mas quem viesse aqui decidir onde
    # otimizar olharia para o lugar errado.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: bcmath, intl, pcntl, zip, sqlite3, pdo_sqlite
          coverage: none

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Cache das dependências PHP
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php84-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-php84-

      - name: Cache do node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-

      # O download do Chromium é o que domina este job. A versão do browser é amarrada à do
      # `@playwright/test` no lockfile, então o `hashFiles` dele é a chave correta: subir o
      # Playwright invalida o cache, como deve.
      - name: Cache dos browsers do Playwright
        uses: actions/cache@v4
        id: cache-playwright
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Instalar dependências
        run: |
          composer install --prefer-dist --no-interaction --no-progress
          npm ci

      # Com o cache quente, só as dependências de sistema — os binários já estão em disco.
      - name: Instalar browsers do Playwright
        run: |
          if [ "${{ steps.cache-playwright.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

      - name: Preparar ambiente
        run: |
          cp .env.example .env
          php artisan key:generate
          npm run build

      # Em série de propósito: --parallel multiplicaria processos de navegador e exigiria
      # banco por worker.
      - name: Testes de tela (Pest browser)
        run: php artisan test --testsuite=Browser

  instalacao:
    # Prova que `composer create-project` continua entregando o projeto pronto.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: bcmath, intl, pcntl, zip, sqlite3, pdo_sqlite
          coverage: none

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Cache das dependências PHP
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php84-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-php84-

      - name: Instalar dependências
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Rodar o instalador do kit
        run: |
          cp .env.example .env
          php artisan kit:install --ansi

      - name: Verificar que os painéis respondem
        run: |
          php artisan serve --port=8000 &
          sleep 5
          for rota in up app/login admin/login infra/login; do
            codigo=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8000/$rota")
            echo "$rota -> $codigo"
            [ "$codigo" = "200" ] || exit 1
          done
