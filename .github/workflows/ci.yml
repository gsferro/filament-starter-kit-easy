name: CI

on:
  push:
    branches: [main]
  pull_request:
  # O job `cobertura` roda em SERIE e leva ~52 min neste runner (medido em 2026-09-25, no
  # primeiro disparo manual; sao ~32 min numa maquina local de 20 nucleos). Ele nao roda
  # em pull request; o disparo manual existe para quem quiser o numero antes do merge.
  workflow_dispatch:

jobs:
  qualidade:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: bcmath, intl, pcntl, zip, sqlite3, pdo_sqlite
          coverage: none

      - name: Cache das dependências PHP
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: ${{ runner.os }}-php84-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-php84-

      - name: Instalar dependências
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Preparar ambiente
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Estilo (Pint)
        run: vendor/bin/pint --test

      - name: Análise estática (PHPStan)
        run: vendor/bin/phpstan analyse --no-progress

      # Seleção de suíte, e NÃO `--exclude-group=browser`: o grupo é filtrado na EXECUÇÃO,
      # mas o pest-plugin-browser sobe o Playwright já na COLETA — ao parsear qualquer
      # arquivo com `visit()` (UsesBrowserTestCaseMethodFilter.php:57-60). Com o grupo, este
      # job morria em PlaywrightNotInstalledException sem rodar um único teste. Nomear as
      # suítes tira as pastas de browser da coleta, e elas seguem cobertas no job `telas`.
      # `--parallel` porque a suíte em série não usa o runner: medido em 2026-09-24, a MESMA
      # suíte e o MESMO commit levam 1.162 s em série aqui e 334 s em paralelo (16 núcleos).
      # O runner tem 4 vCPU, e três ficavam parados durante 19 minutos.
      #
      # A regra `.ai/rules/testes-browser.md` PROIBE `--parallel` com navegador, e a proibição
      # **não alcança este job**: ele nomeia as suítes, e `Browser`/`BrowserTenancy` não estão
      # entre elas — elas rodam no job `telas`, em série. Isto está escrito porque confundir os
      # dois casos já produziu o achado QA-11 e a reincidência QA-24.
      - name: Testes (Pest)
        run: php artisan test --testsuite=Unit,Feature,Kit,Tenancy --parallel

  telas:
    # Navegador real sobre as 52 telas dos três painéis. Job próprio porque é o único que
    # precisa de Node + browsers do Playwright, e porque uma falha aqui não deve esconder uma
    # falha de estilo.
    #
    # A redação anterior justificava a separação dizendo que este job "leva ~2min contra os
    # segundos do job de qualidade". **O número inverteu de sinal e ninguém remediu**: medido
    # em 2026-09-24, `telas` leva 226 s e `qualidade` levava 1.162 s. A separação continua
    # certa, por outro motivo — isolar Node e Playwright — mas quem viesse aqui decidir onde
    # otimizar olharia para o lugar errado.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: bcmath, intl, pcntl, zip, sqlite3, pdo_sqlite
          coverage: none

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Cache das dependências PHP
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: ${{ runner.os }}-php84-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-php84-

      - name: Cache do node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-

      # O download do Chromium é o que domina este job. A versão do browser é amarrada à do
      # `@playwright/test` no lockfile, então o `hashFiles` dele é a chave correta: subir o
      # Playwright invalida o cache, como deve.
      - name: Cache dos browsers do Playwright
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache-playwright
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Instalar dependências
        run: |
          composer install --prefer-dist --no-interaction --no-progress
          npm ci

      # Com o cache quente, só as dependências de sistema — os binários já estão em disco.
      - name: Instalar browsers do Playwright
        run: |
          if [ "${{ steps.cache-playwright.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

      - name: Preparar ambiente
        run: |
          cp .env.example .env
          php artisan key:generate
          npm run build

      # Em série de propósito: --parallel multiplicaria processos de navegador e exigiria
      # banco por worker.
      - name: Testes de tela (Pest browser)
        run: php artisan test --testsuite=Browser

  cobertura:
    # A cobertura de linha de `app/`, medida e confrontada com o badge versionado.
    #
    # ## Por que NAO roda em pull request
    #
    # `--parallel --coverage` nao existe: o Pest imprime o *usage* do paratest, e
    # `artisan test --parallel --coverage-clover` roda e nao gera arquivo nenhum (ADR-02). A
    # medicao e serial por construcao, e custa **52 min neste runner** -- medido em 2026-09-25,
    # no primeiro disparo manual deste job -- contra os ~6 min da suite paralela. Cobrar isso de
    # toda PR multiplicaria por nove o tempo de CI do repositorio inteiro para vigiar um numero
    # que se move ~1 pp a cada ~100 linhas.
    #
    # O numero local (~32 min, 20 nucleos) NAO serve para decidir isto: quem paga a conta e o
    # runner de 4 vCPU, e a suite e serial, entao ela nao aproveita nucleo nenhum dos dois lados.
    #
    # Em `main` o custo e aceitavel e o sinal chega no mesmo dia. Quem quiser o numero antes
    # do merge dispara pelo `workflow_dispatch`.
    if: github.event_name != 'pull_request'

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: bcmath, intl, pcntl, zip, sqlite3, pdo_sqlite
          # PCOV, e nao Xdebug: para cobertura de LINHA o Xdebug nao acrescenta nada e custa
          # muito mais. Ver ADR-01.
          coverage: pcov

      - name: Cache das dependencias PHP
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: ${{ runner.os }}-php84-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-php84-

      - name: Instalar dependencias
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Preparar ambiente
        run: |
          cp .env.example .env
          php artisan key:generate

      # `--testsuite`, e nao caminhos: a composicao da medicao segue a MESMA fonte que o resto
      # do CI (o `phpunit.xml`). Com caminhos, acrescentar um `<directory>` ao testsuite `Kit`
      # -- como `Browser` ja faz com `tests/BrowserTenancy` -- passaria a valer em todo job
      # menos neste, e o denominador cairia sem ninguem notar.
      #
      # `--no-tia` explicito: o caminho literal desligava o TIA por efeito colateral, e
      # `--testsuite` nao desliga. Medir com a suite amostrada pelo diff daria um numero que
      # nao e a cobertura de nada.
      #
      # Sem `--write`: aqui o comando VERIFICA. Ele reprova quando a cobertura cai abaixo do
      # piso de 78% (ADR-06) e quando `.github/badges/cobertura.json` commitado diverge do
      # medido -- que e a guarda contra o numero do README envelhecer em silencio.
      - name: Medir a cobertura e conferir o badge
        run: |
          php -d pcov.enabled=1 vendor/bin/pest --testsuite=Kit,Tenancy --no-tia --coverage-clover=cobertura.xml
          php artisan kit:cobertura cobertura.xml --min=78 --ansi

  instalacao:
    # Prova que `composer create-project` continua entregando o projeto pronto.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: bcmath, intl, pcntl, zip, sqlite3, pdo_sqlite
          coverage: none

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Cache das dependências PHP
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: ${{ runner.os }}-php84-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-php84-

      - name: Instalar dependências
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Rodar o instalador do kit
        run: |
          cp .env.example .env
          php artisan kit:install --ansi

      - name: Verificar que os painéis respondem
        run: |
          php artisan serve --port=8000 &
          sleep 5
          for rota in up app/login admin/login infra/login; do
            codigo=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8000/$rota")
            echo "$rota -> $codigo"
            [ "$codigo" = "200" ] || exit 1
          done

  site:
    # RQ-36 (Adendo 3): o CI de pull request passa a construir e conferir o site de
    # documentação (build, links, acessibilidade e diagramas) ANTES do merge. O defeito que
    # motivou isto — o DG-11 quebrado por um `;` dentro de uma nota Mermaid, achado só porque
    # alguém rodou o build à mão — não aparecia aqui: o `pages.yml` só roda DEPOIS do merge, em
    # push para `main`.
    #
    # Só quando o PR toca `docs/` ou `site/`: os outros jobs deste arquivo já cobrem toda PR, e
    # rodar Node + Astro + Playwright numa PR só de `app/` gastaria ~3-5 min sem examinar nada
    # que mudou. Sem `dorny/paths-filter` nem outra action de terceiro nova para decidir isso —
    # um `git diff` entre as duas pontas do PR já responde, e a AcoesPinadasPorShaTest não
    # precisa aprender mais uma origem de supply chain só para um filtro de caminho.
    #
    # Só em pull_request: em push para `main` quem constrói e PUBLICA é o `pages.yml` — rodar
    # de novo aqui mediria a mesma coisa duas vezes, e este job nunca publica nada.
    if: github.event_name == 'pull_request'

    runs-on: ubuntu-latest

    # No NÍVEL DO JOB, pelo mesmo motivo do `pages.yml`: o conferidor de links precisa descontar
    # o mesmo prefixo que o build aplicou, e o de acessibilidade precisa navegar para ele.
    env:
      DOCS_BASE: /filament-starter-kit-easy

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Histórico completo: o diff abaixo compara as duas pontas do PR contra o ancestral
          # comum, e um checkout raso (o padrão desta action) não tem a base disponível.
          fetch-depth: 0

      - name: Verificar se o PR toca docs/ ou site/
        id: mudou
        run: |
          if git diff --name-only "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" \
            | grep -qE '^(docs|site)/'; then
            echo "toca=true" >> "$GITHUB_OUTPUT"
          else
            echo "toca=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.mudou.outputs.toca == 'true'
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Instalar dependências
        if: steps.mudou.outputs.toca == 'true'
        working-directory: site
        run: npm ci

      - name: Construir o site
        if: steps.mudou.outputs.toca == 'true'
        working-directory: site
        run: npm run build

      - name: Conferir links, âncoras e redirects
        if: steps.mudou.outputs.toca == 'true'
        working-directory: site
        run: node verifica-links.mjs

      - name: Instalar o navegador do Playwright
        if: steps.mudou.outputs.toca == 'true'
        working-directory: site
        run: npx playwright install --with-deps chromium

      - name: Conferir diagramas e acessibilidade (axe, WCAG 2.1 AA, nos dois temas)
        if: steps.mudou.outputs.toca == 'true'
        working-directory: site
        run: |
          npx astro preview &
          npx wait-on "http://localhost:4321${DOCS_BASE}/pt/" -t 60000
          node verifica-acessibilidade.mjs
