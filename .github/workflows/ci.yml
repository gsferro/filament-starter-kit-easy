name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  qualidade:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: bcmath, intl, pcntl, zip, sqlite3, pdo_sqlite
          coverage: none

      - name: Instalar dependências
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Preparar ambiente
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Estilo (Pint)
        run: vendor/bin/pint --test

      - name: Análise estática (PHPStan)
        run: vendor/bin/phpstan analyse --no-progress

      # Seleção de suíte, e NÃO `--exclude-group=browser`: o grupo é filtrado na EXECUÇÃO,
      # mas o pest-plugin-browser sobe o Playwright já na COLETA — ao parsear qualquer
      # arquivo com `visit()` (UsesBrowserTestCaseMethodFilter.php:57-60). Com o grupo, este
      # job morria em PlaywrightNotInstalledException sem rodar um único teste. Nomear as
      # suítes tira as pastas de browser da coleta, e elas seguem cobertas no job `telas`.
      - name: Testes (Pest)
        run: php artisan test --testsuite=Unit,Feature,Kit,Tenancy

  telas:
    # Navegador real sobre as 52 telas dos três painéis. Job próprio porque é o único que
    # precisa de Node + browsers do Playwright, e porque leva ~2min contra os segundos do
    # job de qualidade — separado, uma falha aqui não esconde uma falha de estilo.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: bcmath, intl, pcntl, zip, sqlite3, pdo_sqlite
          coverage: none

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Instalar dependências
        run: |
          composer install --prefer-dist --no-interaction --no-progress
          npm ci

      - name: Instalar browsers do Playwright
        run: npx playwright install --with-deps chromium

      - name: Preparar ambiente
        run: |
          cp .env.example .env
          php artisan key:generate
          npm run build

      # Em série de propósito: --parallel multiplicaria processos de navegador e exigiria
      # banco por worker.
      - name: Testes de tela (Pest browser)
        run: php artisan test --testsuite=Browser

  seguranca:
    # Varredura de dependencias em TODO push e PR, e existe por um motivo especifico: a
    # integracao do app do Snyk no GitHub so escaneia quando o manifesto MUDA. Tres PRs
    # seguidos desta rodada voltaram "No manifest changes detected" e passaram sem escanear
    # nada — check verde que nao olhou. Este job olha sempre.
    #
    # Sem PHP e sem `composer install`: o Snyk le `composer.lock` e `package-lock.json`
    # diretamente, e `--all-projects` cobre os dois. Instalar dependencias aqui so gastaria
    # minuto de runner.
    #
    # O `.snyk` da raiz e lido por default — nao passamos `--policy-path`. Achado aceito se
    # silencia LA, com issue ID, `reason` e `expires`, nunca afrouxando o threshold aqui.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      # PR de fork nao recebe secret, e repositorio recem-clonado tambem nao tem. Nos dois
      # casos o job AVISA e passa, em vez de ficar vermelho para sempre por falta de
      # configuracao. O aviso e deliberado: varredura que nao roda em silencio e pior que
      # varredura nenhuma, porque o check verde diz que olhou.
      - name: Verificar o token
        id: token
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -z "$SNYK_TOKEN" ]; then
            echo "::warning title=Varredura nao executada::SNYK_TOKEN ausente. Adicione o secret (app.snyk.io/account -> Auth Token) para o Snyk rodar."
            echo "tem=false" >> "$GITHUB_OUTPUT"
          else
            echo "tem=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Instalar o Snyk
        if: steps.token.outputs.tem == 'true'
        run: npm install -g snyk

      # Reprova em high e critical. Para afrouxar, troque por `--severity-threshold=critical`
      # — mas a resposta certa para um achado aceito e o bloco `ignore` do `.snyk`, que
      # registra QUEM aceitou, POR QUE e ATE QUANDO.
      - name: Varredura de dependencias (Snyk)
        if: steps.token.outputs.tem == 'true'
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --all-projects --severity-threshold=high

  instalacao:
    # Prova que `composer create-project` continua entregando o projeto pronto.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: bcmath, intl, pcntl, zip, sqlite3, pdo_sqlite
          coverage: none

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Instalar dependências
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Rodar o instalador do kit
        run: |
          cp .env.example .env
          php artisan kit:install --ansi

      - name: Verificar que os painéis respondem
        run: |
          php artisan serve --port=8000 &
          sleep 5
          for rota in up app/login admin/login infra/login; do
            codigo=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8000/$rota")
            echo "$rota -> $codigo"
            [ "$codigo" = "200" ] || exit 1
          done
