# Stacks de desenvolvimento do start-kit.
# Usar ou não fica a cargo de cada projeto: `docker compose up -d`
# Serviços opcionais ficam atrás de profiles: `docker compose --profile storage --profile queue up -d`

name: start-kit

services:
  app:
    image: serversideup/php:8.4-fpm-nginx
    ports:
      - '${APP_PORT:-8080}:8080'
    environment:
      PHP_OPCACHE_ENABLE: '0'
      AUTORUN_ENABLED: 'false'
    volumes:
      - '.:/var/www/html'
    depends_on:
      - pgsql
      - redis
    networks:
      - kit

  # Worker de filas via Horizon (opcional): --profile queue
  horizon:
    image: serversideup/php:8.4-fpm-nginx
    command: ['php', '/var/www/html/artisan', 'horizon']
    profiles: [queue]
    volumes:
      - '.:/var/www/html'
    depends_on:
      - pgsql
      - redis
    networks:
      - kit

  pgsql:
    image: postgres:17-alpine
    ports:
      - '${FORWARD_DB_PORT:-5432}:5432'
    environment:
      POSTGRES_DB: '${DB_DATABASE:-laravel}'
      POSTGRES_USER: '${DB_USERNAME:-laravel}'
      POSTGRES_PASSWORD: '${DB_PASSWORD:-secret}'
    volumes:
      - 'kit-pgsql:/var/lib/postgresql/data'
    networks:
      - kit

  redis:
    image: redis:7-alpine
    ports:
      - '${FORWARD_REDIS_PORT:-6379}:6379'
    volumes:
      - 'kit-redis:/data'
    networks:
      - kit

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '${FORWARD_MAILPIT_PORT:-1025}:1025'
      - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'
    networks:
      - kit

  # Armazenamento S3 compatível (opcional): --profile storage
  minio:
    image: minio/minio:latest
    command: 'minio server /data --console-address ":8900"'
    profiles: [storage]
    ports:
      - '${FORWARD_MINIO_PORT:-9000}:9000'
      - '${FORWARD_MINIO_CONSOLE_PORT:-8900}:8900'
    environment:
      MINIO_ROOT_USER: '${MINIO_ROOT_USER:-kit}'
      MINIO_ROOT_PASSWORD: '${MINIO_ROOT_PASSWORD:-password}'
    volumes:
      - 'kit-minio:/data'
    networks:
      - kit

networks:
  kit:
    driver: bridge

volumes:
  kit-pgsql:
  kit-redis:
  kit-minio:
